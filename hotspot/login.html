<!DOCTYPE html>
<html>
<!-- 
  SAVIVAH INTERNET SOLUTIONS — MikroTik Hotspot Login Page
  
  Upload this file to: MikroTik → Files → hotspot/login.html
  
  MikroTik variables used:
    $(link-login-only) — the URL to post login credentials to
    $(link-orig-esc)   — original URL the user was trying to visit
    $(error)           — error message from MikroTik if login failed
    $(username)        — pre-filled username if available
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Savivah Internet Solutions — Connect</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:linear-gradient(160deg,#3d1e17 0%,#47251d 40%,#6b3a2f 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;padding:1rem}
.box{background:#fff;border-radius:20px;padding:2rem;max-width:360px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.3)}
.logo{text-align:center;margin-bottom:1.5rem}
.logo-ring{width:64px;height:64px;border-radius:50%;background:#47251d;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 10px}
.logo h1{font-size:17px;font-weight:700;color:#47251d}
.logo p{font-size:11px;color:#9a7068;margin-top:3px}
label{font-size:11px;font-weight:600;color:#5c3a34;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.04em}
input[name="username"]{width:100%;padding:13px 14px;border:1.5px solid #e8d5cf;border-radius:10px;font-size:16px;font-family:'Courier New',monospace;letter-spacing:3px;text-transform:uppercase;text-align:center;color:#47251d;background:#fdf6f4;outline:none;margin-bottom:12px;transition:border 0.15s}
input[name="username"]:focus{border-color:#47251d;background:#fff}
input[name="username"]::placeholder{font-family:-apple-system,sans-serif;letter-spacing:normal;font-size:14px;color:#c4a09a;text-transform:none}
.btn{width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;background:#47251d;color:#fff;font-family:inherit;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:#2e1712}
.btn:active{transform:scale(0.98)}
.error{background:#fdecea;color:#c0392b;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;text-align:center}
.buy-link{text-align:center;margin-top:1rem;font-size:13px;color:#9a7068}
.buy-link a{color:#47251d;font-weight:600;text-decoration:none}
.buy-link a:hover{text-decoration:underline}
.divider{display:flex;align-items:center;gap:8px;margin:1rem 0;color:#c4a09a;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e8d5cf}
.footer{text-align:center;margin-top:1.5rem;font-size:10px;color:#c4a09a}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-ring">📶</div>
    <h1>Savivah Internet Solutions</h1>
    <p>Fast · Reliable · Affordable WiFi</p>
  </div>

  <!-- Show error if MikroTik returns one -->
  $(if error)
  <div class="error">❌ $(error)</div>
  $(endif)

  <form action="$(link-login-only)" method="post" name="login">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">
    <!-- Password is same as username (voucher code) for MikroTik hotspot users -->
    <input type="hidden" name="password" id="pass-field">

    <label>Enter Voucher Code</label>
    <input type="text" name="username" id="username" placeholder="e.g. XHBK-3P2N" 
           value="$(username)" maxlength="9" autocomplete="off" autocorrect="off" 
           autocapitalize="characters" oninput="formatCode(this)">

    <button type="submit" onclick="copyPassFromUser()">🌐 Connect to Internet</button>
  </form>

  <div class="divider">don't have a voucher?</div>

  <div class="buy-link">
    <a href="/hotspot/">🛒 Buy a package with M-Pesa →</a>
  </div>

  <div class="footer">Powered by Savivah Internet Solutions</div>
</div>

<script>
function formatCode(input) {
  let v = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (v.length > 4) v = v.slice(0, 4) + '-' + v.slice(4, 8);
  input.value = v;
}
function copyPassFromUser() {
  document.getElementById('pass-field').value = document.getElementById('username').value;
}
// Auto-focus
document.addEventListener('DOMContentLoaded', () => {
  const u = document.getElementById('username');
  if (u && !u.value) u.focus();
});
</script>
</body>
</html>
