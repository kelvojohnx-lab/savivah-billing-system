<!DOCTYPE html>
<!-- Upload to MikroTik: Files → hotspot/alogin.html -->
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connected! — Savivah Internet Solutions</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:linear-gradient(160deg,#1a7a4a 0%,#47251d 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;padding:1rem}
.box{background:#fff;border-radius:20px;padding:2rem;max-width:360px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.3)}
.icon{font-size:56px;margin-bottom:1rem}
h1{font-size:22px;font-weight:700;color:#1a7a4a;margin-bottom:6px}
p{font-size:14px;color:#5c3a34;margin-bottom:1.5rem;line-height:1.6}
.info-box{background:#fdf6f4;border:1px solid #e8d5cf;border-radius:12px;padding:1rem;margin-bottom:1.5rem;text-align:left}
.info-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid #f0e0da}
.info-row:last-child{border-bottom:none}
.info-row .label{color:#9a7068}.info-row .val{font-weight:600;color:#47251d}
.btn{display:inline-block;padding:12px 28px;border-radius:12px;background:#47251d;color:#fff;font-size:14px;font-weight:600;text-decoration:none;transition:all 0.15s}
.btn:hover{background:#2e1712}
.footer{margin-top:1.5rem;font-size:11px;color:#c4a09a}
</style>
</head>
<body>
<div class="box">
  <div class="icon">🎉</div>
  <h1>You're Connected!</h1>
  <p>Welcome to Savivah Internet Solutions.<br>Enjoy your browsing session!</p>

  <div class="info-box">
    <div class="info-row"><span class="label">Status</span><span class="val" style="color:#1a7a4a">✅ Online</span></div>
    <div class="info-row"><span class="label">User</span><span class="val">$(username)</span></div>
    <div class="info-row"><span class="label">Time left</span><span class="val">$(session-time-left)</span></div>
    <div class="info-row"><span class="label">Data used</span><span class="val">$(bytes-in-nice) / $(bytes-out-nice)</span></div>
  </div>

  <a href="$(link-orig)" class="btn">🌐 Start Browsing</a>

  <div class="footer">Savivah Internet Solutions · Fast &amp; Reliable WiFi</div>
</div>
</body>
</html>
