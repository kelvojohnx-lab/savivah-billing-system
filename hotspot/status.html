<!DOCTYPE html>
<!-- Upload to MikroTik: Files → hotspot/status.html -->
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="60">
<title>Session Status — Savivah</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:linear-gradient(160deg,#3d1e17,#47251d);font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:1rem}
.box{background:#fff;border-radius:20px;padding:1.75rem;max-width:340px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.3)}
.header{text-align:center;margin-bottom:1.25rem}
.header h1{font-size:16px;font-weight:700;color:#47251d}
.header p{font-size:11px;color:#9a7068;margin-top:2px}
.dot-online{display:inline-block;width:9px;height:9px;border-radius:50%;background:#1a7a4a;margin-right:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.25rem}
.stat{background:#fdf6f4;border-radius:10px;padding:10px;text-align:center}
.stat .val{font-size:16px;font-weight:700;color:#47251d}
.stat .lbl{font-size:10px;color:#9a7068;margin-top:2px}
.btn-row{display:flex;gap:8px}
.btn{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;text-decoration:none;text-align:center;display:block}
.btn-browse{background:#47251d;color:#fff}
.btn-logout{background:#fdf6f4;color:#c0392b;border:1.5px solid #f0c0c0}
.buy-more{text-align:center;margin-top:1rem;font-size:12px;color:#9a7068}
.buy-more a{color:#47251d;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="header">
    <h1>📶 Savivah Internet</h1>
    <p><span class="dot-online"></span> <strong>$(username)</strong> is online</p>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="val">$(session-time-left)</div><div class="lbl">Time Remaining</div></div>
    <div class="stat"><div class="val">$(uptime)</div><div class="lbl">Session Duration</div></div>
    <div class="stat"><div class="val">$(bytes-in-nice)</div><div class="lbl">Downloaded</div></div>
    <div class="stat"><div class="val">$(bytes-out-nice)</div><div class="lbl">Uploaded</div></div>
  </div>
  <div class="btn-row">
    <a href="$(link-orig)" class="btn btn-browse">🌐 Browse</a>
    <a href="$(link-logout)" class="btn btn-logout">Logout</a>
  </div>
  <div class="buy-more">
    Need more time? <a href="/hotspot/">Buy another package →</a>
  </div>
</div>
</body>
</html>
